services:
    app:
        build: &build
            context: .
            args:
                BASE_IMAGE_TAG: '${BASE_IMAGE_TAG:?required - set from docker/base/VERSION, e.g. export BASE_IMAGE_TAG=php85-v1}'
        env_file:
            - .env
            - .env.local
        environment:
            &mercure_url # The hub on the compose network (.env points at its host port, for an app served outside Docker)
            MERCURE_URL: 'http://mercure/.well-known/mercure'
        volumes:
            - ./:/app
        ports:
            - 8080:80

    worker:
        command: 'worker'
        build: *build
        env_file:
            - .env
            - .env.local
        environment: *mercure_url

    # Mercure hub (protocol 1.0) for the live progress of imports and exports. Browsers reach it on the site's
    # origin, /.well-known/mercure proxied to port 3000 (see README), so the subscriber cookie is sent to it.
    mercure:
        image: dunglas/mercure:v1.1.4
        environment:
            SERVER_NAME: ':80'
            # Behind the local proxy: the hub takes its public URL (the tokens' audience) from X-Forwarded-*
            GLOBAL_OPTIONS: |-
                servers {
                    trusted_proxies static private_ranges
                }
            MERCURE_TRUSTED_ISSUERS: '${MERCURE_JWT_ISSUER}'
            MERCURE_PUBLISHER_JWT_KEY: '${MERCURE_JWT_SECRET}'
            MERCURE_SUBSCRIBER_JWT_KEY: '${MERCURE_JWT_SECRET}'
            # The debugger UI at /.well-known/mercure/debug/ (prod-safe, still needs a token)
            MERCURE_EXTRA_DIRECTIVES: 'debugger'
        ports:
            - 3000:80
        volumes:
            - mercure_data:/data
            - mercure_config:/config

    redis:
        image: redis:alpine
        ports:
            - 6379:6379

    rabbitmq:
        image: rabbitmq:4.4-management-alpine
        hostname: 'mabbit'
        ports:
            - 5672:5672
            - 15672:15672
        volumes:
            - rabbitmq:/var/lib/rabbitmq

    elasticsearch:
        build: docker/elasticsearch
        environment:
            - 'discovery.type=single-node'
            - 'bootstrap.memory_lock=true'
            - 'ES_JAVA_OPTS=-Xms1024m -Xmx1024m'
            - 'xpack.security.enabled=false'
            - 'xpack.security.enrollment.enabled=false'
        ulimits:
            memlock:
                soft: -1
                hard: -1
        ports:
            - 9200:9200
        volumes:
            - esdata:/usr/share/elasticsearch/data

    kibana:
        image: docker.elastic.co/kibana/kibana:9.5.4
        ports:
            - 5601:5601
        depends_on:
            - elasticsearch

volumes:
    esdata:
    rabbitmq:
    mercure_data:
    mercure_config:
