name: 'Continuous Integration'

on:
    pull_request:
    push:
        branches:
            - 'main'

permissions:
    contents: read

# Supersede outdated runs of a pull request; push runs (head_ref empty) are never cancelled.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    matrix:
        name: Generate job matrix
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            matrix: ${{ steps.matrix.outputs.matrix }}
        steps:
            - name: Gather CI configuration
              id: matrix
              uses: laminas/laminas-ci-matrix-action@v1

    qa:
        name: QA Checks
        needs: [matrix]
        runs-on: ${{ matrix.operatingSystem }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
        steps:
            - name: ${{ matrix.name }}
              uses: laminas/laminas-continuous-integration-action@v1
              with:
                  job: ${{ matrix.job }}

    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: amqp, redis
            - name: Install Composer dependencies
              run: composer install --no-interaction --no-progress --prefer-dist
            - name: Setup pnpm
              uses: pnpm/action-setup@v6
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Biome
              run: pnpm lint-ci
            - name: TypeScript
              run: pnpm typecheck
            - name: Knip
              run: pnpm knip

    test:
        name: Test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup pnpm
              uses: pnpm/action-setup@v6
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Test
              run: pnpm test

    image:
        # Part of this workflow (not a workflow of its own) so that "CI passed" waits for it: a Renovate bump that
        # broke the release image (@tabler/core 1.6, #645) was merged while only its image build was red.
        # Every PR: besides the Dockerfile, docker/ and the dependencies, the build runs `pnpm build` over assets/
        # and templates/, and the prod `cache:warmup` over src/ and config/, which the test env does not.
        #
        # Nothing is pushed and no cache is used. The base (docker/base) is stable and slow to build (ext-mjml
        # compiles from Rust), so it is only rebuilt when the PR changes docker/base/; otherwise the published,
        # immutable guystlr/by-night-base:<docker/base/VERSION> is pulled. Either way it lands in the local image
        # store, where the app's `FROM` resolves it, so a PR bumping VERSION to an unpublished tag still validates.
        name: Build images (no push)
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        env:
            DOCKER_BUILDKIT: '1'
            # Secrets can't be tested in `if:`; empty on fork PRs.
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        steps:
            - uses: actions/checkout@v7
              with:
                  # HEAD is the PR merge commit and HEAD^1 the base branch tip, so
                  # `git diff HEAD^1 HEAD` is exactly what the PR changes.
                  fetch-depth: 2

            # Pull public Docker Hub images through Google's mirror: every pull through Docker Hub
            # counts against the account's quota, shared with docker-php and the servers. The
            # private base image isn't on the mirror, so Docker falls back to Docker Hub for it.
            - name: Use the mirror.gcr.io registry mirror
              run: |
                  config=$(sudo cat /etc/docker/daemon.json 2> /dev/null | grep . || echo '{}')
                  jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' <<< "$config" | sudo tee /etc/docker/daemon.json > /dev/null
                  sudo systemctl restart docker
                  docker info --format 'Registry mirrors: {{.RegistryConfig.Mirrors}}'

            # The base image is private. Without credentials (fork PRs) the pull below
            # fails and the base is built locally instead.
            - name: Login to Docker Hub
              if: env.DOCKER_USERNAME != ''
              uses: docker/login-action@v4
              with:
                  username: ${{ env.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Pull or build base image
              id: base
              run: |
                  TAG=$(cat docker/base/VERSION)
                  if [ -z "$TAG" ]; then echo "::error::docker/base/VERSION is empty"; exit 1; fi
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                  IMAGE="guystlr/by-night-base:$TAG"

                  if git diff --quiet HEAD^1 HEAD -- docker/base/; then
                      if docker pull --quiet "$IMAGE"; then
                          echo "::notice::docker/base/ unchanged — reusing published $IMAGE"
                          exit 0
                      fi
                      echo "::warning::$IMAGE could not be pulled (unpublished, or no registry credentials) — building it locally"
                  elif git diff --quiet HEAD^1 HEAD -- docker/base/VERSION; then
                      echo "::warning file=docker/base/VERSION::docker/base/ changed without a VERSION bump — published tags are immutable, so this change will never be published"
                  fi

                  docker build -t "$IMAGE" docker/base

            - name: Build app image
              run: docker build --build-arg "BASE_IMAGE_TAG=${{ steps.base.outputs.tag }}" -t by-night:pr .

    phpunit:
        # Runs the suite in docker/base, which bakes ext-mjml in: the tests that send an e-mail
        # (#[RequiresPhpExtension('mjml')]) are skipped wherever it is missing, as in the laminas containers of the
        # QA Checks, which no longer run PHPUnit (.laminas-ci.json). The base is pulled or built as in the image job.
        name: PHPUnit (base image)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        env:
            DOCKER_BUILDKIT: '1'
            # Secrets can't be tested in `if:`; empty on fork PRs.
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        steps:
            - uses: actions/checkout@v7
              with:
                  # HEAD^1 is the base branch tip on a PR (HEAD is the merge commit) and the previous commit on a push
                  # to main, so `git diff HEAD^1 HEAD` is exactly what the change brings.
                  fetch-depth: 2

            # Pull public Docker Hub images through Google's mirror (see the image job).
            - name: Use the mirror.gcr.io registry mirror
              run: |
                  config=$(sudo cat /etc/docker/daemon.json 2> /dev/null | grep . || echo '{}')
                  jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' <<< "$config" | sudo tee /etc/docker/daemon.json > /dev/null
                  sudo systemctl restart docker
                  docker info --format 'Registry mirrors: {{.RegistryConfig.Mirrors}}'

            # The base image is private. Without credentials (fork PRs) the pull below
            # fails and the base is built locally instead.
            - name: Login to Docker Hub
              if: env.DOCKER_USERNAME != ''
              uses: docker/login-action@v4
              with:
                  username: ${{ env.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Pull or build base image
              id: base
              run: |
                  TAG=$(cat docker/base/VERSION)
                  if [ -z "$TAG" ]; then echo "::error::docker/base/VERSION is empty"; exit 1; fi
                  IMAGE="guystlr/by-night-base:$TAG"
                  echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

                  # On a push to main that bumps VERSION, the new tag is published by build-base-image.yml at the
                  # same time: until then the pull fails and the base is built here.
                  if git diff --quiet HEAD^1 HEAD -- docker/base/; then
                      if docker pull --quiet "$IMAGE"; then
                          echo "::notice::docker/base/ unchanged — reusing published $IMAGE"
                          exit 0
                      fi
                      echo "::warning::$IMAGE could not be pulled (unpublished, or no registry credentials) — building it locally"
                  fi

                  docker build -t "$IMAGE" docker/base

            # One container for every step, the checkout mounted at /app. The base loads no php.ini: memory_limit is
            # PHP's 128M default, too little to compile the Symfony container (Composer's cache:clear script, the
            # console) or to run the suite (324 MB). Its CLI opcache is off, so the sources are read as they are.
            - name: Start PHP container
              run: |
                  docker run --detach --name php -v "$GITHUB_WORKSPACE:/app" -w /app "${{ steps.base.outputs.image }}" tail -f /dev/null
                  docker exec php sh -c 'echo "memory_limit = -1" > "$PHP_INI_DIR/conf.d/zz-ci.ini"'

            - name: Install Composer dependencies
              env:
                  # Authenticated GitHub downloads: the hosted runners share their public IPs.
                  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
              run: docker exec -e COMPOSER_AUTH php composer install --no-interaction --no-progress --prefer-dist

            - name: Create test database
              run: docker exec php bin/console doctrine:schema:create --env=test --no-interaction

            # CI never runs "pnpm build": stub the Reprise manifests so tests that render a full page
            # (asset() / reprise_entry_*_tags()) do not fail on a missing file. The manifest can be an
            # empty array, but Reprise validates entrypoints.json and throws unless "isProd",
            # "publicPath" and "entryPoints" are present with the right types.
            - name: Stub frontend build manifests
              run: |
                  mkdir -p public/build
                  echo '[]' > public/build/manifest.json
                  echo '{"isProd":true,"devServer":null,"publicPath":"/build/","entryPoints":{}}' > public/build/entrypoints.json

            - name: PHPUnit
              run: docker exec php vendor/bin/phpunit

    ci-passed:
        name: CI passed
        # image is skipped on pushes to main: skipped jobs pass, only a failed or cancelled one fails this check
        needs: [matrix, qa, lint, test, image, phpunit]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check that all required jobs succeeded
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1
