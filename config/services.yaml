# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    feedback_recipient_email: '%env(FEEDBACK_RECIPIENT_EMAIL)%'
    content_removal_recipient_email: '%env(CONTENT_REMOVAL_RECIPIENT_EMAIL)%'
    facebook_id_page: '205292952998805'
    # Single source of truth for every Meta versioned surface (Graph API + JS SDK).
    # Each version is supported for 2 years: https://developers.facebook.com/docs/graph-api/changelog/
    facebook_graph_api_version: 'v26.0'
    google_map_key: '%env(GOOGLE_MAP_KEY_WEB)%'
    google_map_id: '%env(GOOGLE_MAP_ID)%'
    twitter_id_page: 'By__Night'
    disable_polled_feeds: '%kernel.debug%'
    patterns.path: '.+'
    patterns.page: '[1-9](\d*)'
    patterns.id: '\d+'
    patterns.slug: '[^/]+'
    patterns.social: 'facebook|google|twitter'
    patterns.admin_social: 'facebook_admin|google_admin|twitter_admin'
    # Days after its end date during which an event is still submitted in the sitemap. Older
    # events stay online and indexable: they are simply left to Google's own crawl schedule
    # (see App\SEO\EventIndexingPolicy).
    app.seo.event_sitemap_grace_days: 30

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $facebookGraphApiVersion: '%facebook_graph_api_version%'
            $memoryCache: '@redis.app_cache_pool'
            $persistProcessor: '@api_platform.doctrine.orm.state.persist_processor'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Admin/Filter'
            - '../src/Admin/Field'
            - '../src/Annotation'
            - '../src/Dependency'
            - '../src/DependencyInjection'
            - '../src/Dto'
            - '../src/Entity'
            - '../src/Exception'
            - '../src/File'
            - '../src/Kernel.php'
            - '../src/Migrations'
            - '../src/Reject'
            - '../src/Search'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Event images are downloaded from the URLs the sources give: such a URL (or a redirect)
    # must not reach into the private network (cloud metadata, internal services)
    app.image_download_client:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@http_client']

    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    App\Request\ParamConverter\:
        resource: '../src/Request/ParamConverter'
        tags:
            - { name: controller.argument_value_resolver, priority: 150 }

    App\Social\FacebookAdmin:
        arguments:
            $config: { id: '%env(FACEBOOK_API_ID)%', secret: '%env(FACEBOOK_API_SECRET)%' }

    App\Social\Google:
        arguments:
            $config: { id: 'unused', secret: 'unused' }

    App\Social\Twitter:
        arguments:
            $config: { id: 'unused', secret: 'unused' }

    App\Social\Facebook:
        arguments:
            $config: { id: '%env(FACEBOOK_API_ID)%', secret: '%env(FACEBOOK_API_SECRET)%' }

    # src/Admin/Field is excluded from the App\ glob above, so this one is wired by hand. The
    # priority has to be lower than EasyAdmin's own EmptyDataConfigurator (which is registered
    # without one, so 0) for this to run after it and win; -9999 is taken by CommonPostConfigurator.
    App\Admin\Field\Configurator\SluggableEmptyDataConfigurator:
        autoconfigure: false
        arguments:
            # StofDoctrineExtensionsBundle registers the listener without a class alias.
            $sluggableListener: '@stof_doctrine_extensions.listener.sluggable'
        tags:
            - { name: ea.field_configurator, priority: -100 }

    App\Validator\Constraints\EventConstraintValidator:
        tags:
            - { name: validator.constraint_validator, alias: EventContraintValidator }

    App\Doctrine\EntityListener\:
        resource: '../src/Doctrine/EntityListener'
        tags:
            - { name: doctrine.orm.entity_listener, lazy: true }

    s3_client:
        class: Aws\S3\S3Client
        arguments:
            - version: '2006-03-01'
              endpoint: '%env(S3_ENDPOINT)%'
              region: '%env(S3_REGION)%'
              use_path_style_endpoint: true
              credentials:
                  key: '%env(S3_KEY)%'
                  secret: '%env(S3_SECRET)%'

    s3_thumb_client:
        class: Aws\S3\S3Client
        arguments:
            - version: '2006-03-01'
              endpoint: '%env(APP_THUMB_S3_ENDPOINT)%'
              region: '%env(APP_THUMB_S3_REGION)%'
              use_path_style_endpoint: true
              credentials:
                  key: '%env(APP_THUMB_S3_KEY)%'
                  secret: '%env(APP_THUMB_S3_SECRET)%'

    FOS\ElasticaBundle\Persister\AsyncPagerPersister: '@fos_elastica.async_pager_persister'
    FOS\ElasticaBundle\Persister\PersisterRegistry: '@fos_elastica.persister_registry'
