# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: true
    trusted_headers:
        ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    # Note that the session will be started ONLY if you read or write from it.
    session:
        handler_id: 'session.handler.native_file'
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

    #esi: true
    #fragments: true

    # A refused API input is answered with its violations (422): logged below the "error" level, it
    # neither reaches Sentry nor triggers the fingers_crossed handler. Other client errors (404, 405,
    # 400) stay errors, monitored in Sentry.
    exceptions:
        ApiPlatform\Validator\Exception\ValidationException:
            log_level: info
        # A storage outage, not a bug: Picasso answers 503 when the uploads bucket cannot be read (OVH S3,
        # 2026-10-07), as ElasticsearchUnavailableException does while Elasticsearch restarts. Symfony logs a
        # 5xx as critical, which would reach Sentry for every thumbnail requested during the outage.
        Symfony\Component\HttpKernel\Exception\ServiceUnavailableHttpException:
            log_level: warning

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
