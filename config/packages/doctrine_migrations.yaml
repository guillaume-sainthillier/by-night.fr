doctrine_migrations:
    migrations_paths:
        # namespace is arbitrary but should be different from App\Migrations
        # as migrations classes should NOT be autoloaded
        'DoctrineMigrations': '%kernel.project_dir%/migrations'
    storage:
        # Default (SQL table) metadata storage configuration
        table_storage:
            table_name: 'migration_versions'
    enable_profiler: false
    # MySQL commits implicitly on every DDL statement, so a transaction wrapped around a
    # schema migration is already closed when Migrations tries to commit or roll it back.
    # A data-only migration that must be atomic overrides isTransactional() to return true.
    transactional: false
