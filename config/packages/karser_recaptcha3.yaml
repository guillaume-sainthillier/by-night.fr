karser_recaptcha3:
    site_key: '%env(RECAPTCHA3_KEY)%'
    secret_key: '%env(RECAPTCHA3_SECRET)%'
    score_threshold: 0.5

when@dev:
    karser_recaptcha3:
        enabled: false

# The functional tests submit the sign-up form: they must not ask Google to score them
when@test:
    karser_recaptcha3:
        enabled: false
