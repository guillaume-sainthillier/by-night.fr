# Throttles how fast the Messenger workers drain the parser/elastica backlogs so a
# large nightly import (tens of thousands of messages) stays gentle on CPU instead of
# pegging every core. token_bucket allows a short burst (`limit`) then refills at
# `rate` messages/second. Both knobs are env-driven so they can be tuned per host.
framework:
    rate_limiter:
        # Login attempts per account (security.yaml, App\Security\LoginRateLimiter): a
        # successful login starts the count over
        login:
            policy: 'fixed_window'
            limit: 5
            interval: '1 minute'
            cache_pool: 'cache.rate_limiter'
        # Content removal requests per IP address (App\Api\Processor\ContentRemovalRequestProcessor):
        # each e-mails the moderators. Production receives a few a month
        content_removal_request:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'
            cache_pool: 'cache.rate_limiter'
        messenger_parser:
            policy: 'token_bucket'
            limit: '%env(int:MESSENGER_PARSER_RATE_LIMIT)%'
            rate:
                interval: '1 second'
                amount: '%env(int:MESSENGER_PARSER_RATE_LIMIT)%'
            cache_pool: 'cache.rate_limiter'
        messenger_elastica:
            policy: 'token_bucket'
            limit: '%env(int:MESSENGER_ELASTICA_RATE_LIMIT)%'
            rate:
                interval: '1 second'
                amount: '%env(int:MESSENGER_ELASTICA_RATE_LIMIT)%'
            cache_pool: 'cache.rate_limiter'
        # Cloudflare purge API quota, applied to the "cloudflare.client" scoped HTTP client
        # (see http_client.yaml). Cloudflare enforces it per account with a token bucket
        # just like this one: every purge request costs one token whatever the number of
        # URLs it carries (App\Cdn\CloudflareCdnPurger caps that at 100 per request).
        # Figures below are the Free plan; other plans only change these two knobs:
        # Pro 5 req/s + bucket 25, Business 10 req/s + bucket 50, Enterprise 50 req/s +
        # bucket 500. "5 per minute" is modelled as one token every 12 s: same average,
        # but the worst-case wait for a token is 12 s instead of 60 s.
        cloudflare_purge:
            policy: 'token_bucket'
            limit: 25
            rate:
                interval: '12 seconds'
                amount: 1
            cache_pool: 'cache.rate_limiter'
        # DATAtourisme API quotas (https://api.datatourisme.fr/v1/docs): 20-30 concurrent
        # requests, ~10 req/s sustained, 1000 req/hour. One token bucket covers all three:
        # the bucket size caps the burst (and our sequential pagination never has more
        # than one request in flight), the refill rate is exactly 1000/hour spread as 5
        # tokens every 18 s so a page is never more than 18 s away. A full import of the
        # ~62k upcoming events is ~250 pages of 250, i.e. about 15 minutes.
        datatourisme_api:
            policy: 'token_bucket'
            limit: 10
            rate:
                interval: '18 seconds'
                amount: 5
            cache_pool: 'cache.rate_limiter'
