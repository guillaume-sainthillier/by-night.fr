security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        legacy:
            algorithm: sha512
            encode_as_base64: false
            iterations: 1

        App\Entity\User:
            algorithm: auto
            migrate_from:
                - bcrypt
                - legacy

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_SUPER_ADMIN: ROLE_USER
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        users:
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|bundles|thumb|thumb-asset|media|uploads|p/image)/
            security: false
        main:
            lazy: true
            provider: users
            user_checker: App\Security\UserChecker
            pattern: ^/

            entry_point: App\Security\UserFormAuthenticator
            custom_authenticators:
                - App\Security\UserSocialAuthenticator
                - App\Security\UserFormAuthenticator
            remember_me:
                secret: '%kernel.secret%'
                # A cookie no longer logs in once the password or a second factor changes (turned on or off, another
                # app, a passkey added or removed): the cookies issued before can no longer skip the new one
                signature_properties: [password, googleAuthenticatorSecret, webauthnKeysFingerprint]

            # Nothing slowed down guessing a member's password: 5 logins a minute per account
            # (the "login" rate limiter), counted per account only, see LoginRateLimiter
            login_throttling:
                limiter: App\Security\LoginRateLimiter

            logout:
                delete_cookies: ['PHPSESSID']
            # Opt-in: only a member who turned on a second factor goes through /2fa (config/packages/scheb_2fa.yaml)
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                # Lands like a login by the form: the page the member logged in from (LoginTargetPath)
                success_handler: App\Security\TwoFactor\TwoFactorSuccessHandler
            # https://symfony.com/doc/current/security/impersonating_user.html
            switch_user: { role: ROLE_ADMIN }

    # Easy way to control access for large sections of your site
    # Note: Only the *first* matching rule is applied
    access_control:
        # Logging out cancels a login waiting for its second factor
        - { path: ^/logout, roles: PUBLIC_ACCESS }
        # The 2FA form, its check and the request of a recovery link: only between the password and the second factor
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        # The signed link of the recovery e-mail, opened without a session
        - { path: ^/connexion/recuperation/, roles: PUBLIC_ACCESS }
        - { path: ^/login-social/service/eventbrite, roles: ROLE_ADMIN }
        - { path: ^/_administration, roles: ROLE_ADMIN }
        - { path: ^/social, roles: ROLE_USER }
        - { path: ^/espace-perso, roles: ROLE_USER }
        - { path: ^/profile, roles: ROLE_USER }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/login-social, roles: PUBLIC_ACCESS }
        - { path: ^/inscription, roles: PUBLIC_ACCESS }
        - { path: ^/resetting, roles: PUBLIC_ACCESS }
        - { path: ^/verifier-email, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/_private, roles: PUBLIC_ACCESS, ips: [127.0.0.1, ::1, 192.168.0.1/24] }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
