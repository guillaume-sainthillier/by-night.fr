framework:
    http_client:
        scoped_clients:
            # Cloudflare API clients used by App\Cdn\CloudflareCdnPurger, one per purge quota. The
            # "rate_limiter" option wraps each in Symfony's ThrottlingHttpClient, which waits for a
            # token (see rate_limiter.yaml) before every request, so the per-account purge quotas
            # are enforced whatever code sends the request. Tag and prefix purges:
            cloudflare.client:
                base_uri: 'https://api.cloudflare.com/client/v4/'
                auth_bearer: '%env(CLOUDFLARE_API_TOKEN)%'
                rate_limiter: 'cloudflare_purge'
            # URL purges, whose quota is far larger
            cloudflare_files.client:
                base_uri: 'https://api.cloudflare.com/client/v4/'
                auth_bearer: '%env(CLOUDFLARE_API_TOKEN)%'
                rate_limiter: 'cloudflare_purge_files'

            # DATAtourisme API client used by App\Parser\Common\DataTourismeParser. Same
            # mechanism: every request first takes a "datatourisme_api" token (see
            # rate_limiter.yaml), so the published quotas hold whatever the caller does.
            datatourisme.client:
                base_uri: 'https://api.datatourisme.fr/v1/'
                headers:
                    X-API-Key: '%env(DATATOURISME_API_KEY)%'
                rate_limiter: 'datatourisme_api'

            # Sowprog API v2 client used by App\Parser\Common\SowProgParser
            # (https://app.sowprog.com/docs/api/v2). Same mechanism: every request first takes a
            # "sowprog_api" token (see rate_limiter.yaml).
            sowprog.client:
                base_uri: 'https://app.sowprog.com/api/v2/'
                auth_bearer: '%env(SOWPROG_API_KEY)%'
                headers:
                    Accept: 'application/json'
                rate_limiter: 'sowprog_api'
