framework:
    http_client:
        scoped_clients:
            # Cloudflare API client used by App\Cdn\CloudflareCdnPurger. The "rate_limiter"
            # option wraps it in Symfony's ThrottlingHttpClient, which waits for a
            # "cloudflare_purge" token (see rate_limiter.yaml) before every request, so the
            # per-account purge quota is enforced whatever code sends the request.
            cloudflare.client:
                base_uri: 'https://api.cloudflare.com/client/v4/'
                auth_bearer: '%env(CLOUDFLARE_API_TOKEN)%'
                rate_limiter: 'cloudflare_purge'

            # DATAtourisme API client used by App\Parser\Common\DataTourismeParser. Same
            # mechanism: every request first takes a "datatourisme_api" token (see
            # rate_limiter.yaml), so the published quotas hold whatever the caller does.
            datatourisme.client:
                base_uri: 'https://api.datatourisme.fr/v1/'
                headers:
                    X-API-Key: '%env(DATATOURISME_API_KEY)%'
                rate_limiter: 'datatourisme_api'
