api_platform:
    title: 'By Night API'
    version: '1.0.0'
    formats:
        json:
            mime_types: ['application/json']
        jsonld:
            mime_types: ['application/ld+json']
    # The MCP tools (config/packages/mcp.yaml) answer in plain JSON: JSON-LD would add @context, @id and @type to every
    # object an assistant reads
    mcp:
        format: json
    defaults:
        stateless: false
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    mapping:
        paths:
            - '%kernel.project_dir%/src/Api/ApiResource'
            - '%kernel.project_dir%/src/Entity'

# The API serves the site's own pages: no documentation nor entry point for the public
when@prod:
    api_platform:
        enable_docs: false
        enable_entrypoint: false
        enable_swagger_ui: false
        enable_re_doc: false
