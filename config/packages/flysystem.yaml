# Read the documentation at https://github.com/thephpleague/flysystem-bundle/blob/master/docs/1-getting-started.md

flysystem:
    storages:
        # LOCAL
        thumbs.local_storage:
            local:
                directory: '%kernel.project_dir%/var/storage/thumbs'

        # S3
        users.storage:
            visibility: public
            aws:
                client: 's3_client' # The service ID of the Aws\S3\S3Client instance
                bucket: '%env(S3_BUCKET_NAME)%'
                prefix: 'uploads/users'

        events.storage:
            visibility: public
            aws:
                client: 's3_client' # The service ID of the Aws\S3\S3Client instance
                bucket: '%env(S3_BUCKET_NAME)%'
                prefix: 'uploads/documents'

        pages.storage:
            visibility: public
            aws:
                client: 's3_client' # The service ID of the Aws\S3\S3Client instance
                bucket: '%env(S3_BUCKET_NAME)%'
                prefix: 'uploads/pages'

        publishers.storage:
            visibility: public
            aws:
                client: 's3_client' # The service ID of the Aws\S3\S3Client instance
                bucket: '%env(S3_BUCKET_NAME)%'
                prefix: 'uploads/publishers'

        countries.storage:
            visibility: public
            aws:
                client: 's3_client' # The service ID of the Aws\S3\S3Client instance
                bucket: '%env(S3_BUCKET_NAME)%'
                prefix: 'uploads/countries'

        cities.storage:
            visibility: public
            aws:
                client: 's3_client' # The service ID of the Aws\S3\S3Client instance
                bucket: '%env(S3_BUCKET_NAME)%'
                prefix: 'uploads/cities'

        # The members' event imports and exports: their contacts and drafts, never public. Downloaded through
        # the personal space (TransferController), which checks who asks.
        transfers.storage:
            visibility: private
            aws:
                client: 's3_client' # The service ID of the Aws\S3\S3Client instance
                bucket: '%env(S3_BUCKET_NAME)%'
                prefix: 'private/transfers'

        # The social images of the events (App\Picture\EventCard): streamed by the route next to their page, which
        # checks who may see a draft's, never read from the bucket
        og.storage:
            visibility: private
            aws:
                client: 's3_client' # The service ID of the Aws\S3\S3Client instance
                bucket: '%env(S3_BUCKET_NAME)%'
                prefix: 'og'

        thumbs.s3_storage:
            visibility: public # objects must be readable anonymously: served straight from the bucket (picasso public_cache)
            aws:
                client: 's3_thumb_client' # The service ID of the Aws\S3\S3Client instance
                bucket: '%env(APP_THUMB_S3_BUCKET_NAME)%'
                prefix: 'thumbs'

        # LAZY ADAPTERS
        thumbs.storage:
            lazy:
                source: 'thumbs.%env(APP_THUMB_STORAGE_SOURCE)%_storage'

when@test:
    flysystem:
        storages:
            # Uploads live in memory: the S3 client has no credentials in tests/CI. A storage
            # listed here replaces the whole definition above (the bundle does no deep merge
            # per storage).
            users.storage:
                memory: ~
            events.storage:
                memory: ~
            pages.storage:
                memory: ~
            publishers.storage:
                memory: ~
            countries.storage:
                memory: ~
            cities.storage:
                memory: ~
            transfers.storage:
                memory: ~
            og.storage:
                memory: ~
            # Rendered thumbnails too (APP_THUMB_STORAGE_SOURCE=local in .env.test): nothing written to var/
            thumbs.local_storage:
                memory: ~
