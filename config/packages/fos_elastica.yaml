# Read the documentation: https://github.com/FriendsOfSymfony/FOSElasticaBundle/blob/master/doc/setup.md
fos_elastica:
    clients:
        default:
            hosts: ['%env(ELASTICSEARCH_URL)%']
            # A failed request marks the node dead for the life of the process. The default "Simple" strategy never
            # tries it again, so once Elasticsearch restarted every FrankenPHP worker kept answering 500 until PHP was
            # restarted (2026-09-30). "RoundRobin" pings a dead node (HEAD /) before giving up on it.
            connection_strategy: RoundRobin
            # The two async consumers can update the same document at once: the losing update is
            # retried rather than failing the bulk with a version conflict. Safe, as every update
            # sends the whole current state of its entity.
            retry_on_conflict: 3

    messenger: ~
    serializer:
        serializer: serializer

    indexes:
        event:
            indexable_callback: ['@App\Elasticsearch\EventIndexableChecker', 'isIndexable']
            # Only the fields below are indexed: the rest of a document (its serializer group) is kept in _source but
            # not mapped. A field a query, a sort, an aggregation or a highlight reads must be declared here
            dynamic: false
            settings:
                index: &index_settings
                    number_of_shards: 1
                    number_of_replicas: 0
                    refresh_interval: 5s
                    codec: best_compression
                analysis:
                    filter:
                        french_elision: &french_elision_filter
                            type: elision
                            articles_case: true
                            articles: [l, m, t, qu, n, s, j, d, c, jusqu, quoiqu, lorsqu, puisqu]
                        french_stemmer:
                            type: stemmer
                            language: light_french
                    analyzer:
                        french_heavy: &french_heavy
                            tokenizer: icu_tokenizer
                            filter:
                                - french_elision
                                - icu_folding
                                - lowercase
                                - french_stemmer
                        french_light: &french_light
                            tokenizer: icu_tokenizer
                            filter:
                                - french_elision
                                - icu_folding
                                - lowercase
                        french_html_heavy:
                            <<: *french_heavy
                            char_filter:
                                - html_strip
                        french_html_light:
                            <<: *french_light
                            char_filter:
                                - html_strip
                        french_natural:
                            tokenizer: icu_tokenizer
                            filter:
                                - french_elision
                                - icu_folding
                                - lowercase
            persistence:
                model: App\Entity\Event
                repository: App\SearchRepository\EventElasticaRepository
                listener:
                    insert: true
                    update: true
                    delete: true
                # Pages by blocks of ids, newest first (App\Elasticsearch\Pager\IdRangePager)
                provider:
                    service: App\Elasticsearch\Pager\EventPagerProvider
            serializer:
                groups:
                    - 'elasticsearch:event:details'
                # An update is merged into the stored document: a field that became null must be sent as
                # null to clear it, or the document would keep the value it had (a removed category, a
                # place without a city, a cleared description would stay searchable until a full populate)
                serialize_null: true
            properties:
                name:
                    type: text
                    analyzer: french_light
                    fields:
                        heavy:
                            type: text
                            analyzer: french_heavy
                # No positions (index_options: freqs) on the fields only the keywords multi_match reads
                # (EventElasticaRepository::createKeywordsQuery()), never a phrase query nor a highlight: the two
                # description fields were 1.17 GB of the 2.6 GB index, ~40% of it positions. A match_phrase, a
                # phrase multi_match or a highlight on one of these fields would fail
                description:
                    type: text
                    analyzer: french_html_light
                    index_options: freqs
                    fields:
                        heavy:
                            type: text
                            analyzer: french_html_heavy
                            index_options: freqs
                startDate:
                    type: date
                    format: yyyy-MM-dd
                endDate:
                    type: date
                    format: yyyy-MM-dd
                # One entry per session (Event::getSessions()), so the agenda can filter
                # and sort on the dates an event actually takes place, not on its range
                sessions:
                    type: nested
                    properties:
                        startAt:
                            type: date
                            format: yyyy-MM-dd
                        endAt:
                            type: date
                            format: yyyy-MM-dd
                draft:
                    type: boolean
                placeName:
                    type: text
                    analyzer: french_natural
                placeStreet:
                    type: text
                    analyzer: french_natural
                    index_options: freqs
                placeCity:
                    type: text
                    analyzer: french_natural
                    index_options: freqs
                placePostalCode:
                    type: text
                    analyzer: french_natural
                    index_options: freqs
                type:
                    type: text
                    analyzer: french_natural
                # The agenda type pages the event is listed on, found once it is indexed (Event::$agendaTypes): an
                # existing index gets it from app:events:classify-agenda-types, which adds it before writing any
                agendaTypes:
                    type: keyword
                # The lowest price to get in, 0 for a free entry, none when unknown (Event::$startingPrice). A float, as the
                # dynamic mapping of a first document with cents would be
                startingPrice:
                    type: float
                category:
                    type: object
                    properties:
                        id:
                            type: integer
                        name:
                            type: text
                            analyzer: french_natural
                themes:
                    type: nested
                    properties:
                        id:
                            type: integer
                        name:
                            type: text
                            analyzer: french_natural
                place:
                    type: object
                    properties:
                        id:
                            type: integer
                        name:
                            type: text
                            analyzer: french_natural
                        street:
                            type: text
                            analyzer: french_natural
                            index_options: freqs
                        cityName:
                            type: text
                            analyzer: french_natural
                            index_options: freqs
                        cityPostalCode:
                            type: text
                            analyzer: french_natural
                            index_options: freqs
                        city:
                            type: object
                            properties:
                                id:
                                    type: integer
                                location:
                                    type: geo_point
                        # The country filter (EventElasticaRepository::createAreaFilter()), on the code as stored: "FR"
                        country:
                            type: object
                            properties:
                                id:
                                    type: keyword
        city:
            settings:
                index: *index_settings
                analysis:
                    filter:
                        french_elision: *french_elision_filter
                        autocomplete_ngram: &autocomplete_ngram_filter
                            type: edge_ngram
                            min_gram: 2
                            max_gram: 15
                    analyzer:
                        text_analyzer: &text_analyzer
                            tokenizer: icu_tokenizer
                            filter:
                                - french_elision
                                - icu_folding
                                - lowercase
                        autocomplete_index: &autocomplete_index_analyzer
                            tokenizer: icu_tokenizer
                            filter:
                                - french_elision
                                - icu_folding
                                - lowercase
                                - autocomplete_ngram
            dynamic: false
            serializer:
                groups:
                    - 'elasticsearch:city:details'
                # An update is merged into the stored document: a field that became null must be sent as
                # null to clear it, or the document would keep the value it had (a removed category, a
                # place without a city, a cleared description would stay searchable until a full populate)
                serialize_null: true
            properties:
                name:
                    type: text
                    analyzer: text_analyzer
                    fields:
                        autocomplete:
                            type: text
                            analyzer: autocomplete_index
                            search_analyzer: text_analyzer
                postalCodes:
                    type: text
                    analyzer: text_analyzer
                    fields:
                        autocomplete:
                            type: text
                            analyzer: autocomplete_index
                            search_analyzer: text_analyzer
                population:
                    type: integer
                country:
                    type: object
                    properties:
                        name:
                            type: text
                            analyzer: text_analyzer
                parent:
                    type: object
                    properties:
                        name:
                            type: text
                            analyzer: text_analyzer
            persistence:
                driver: orm
                model: App\Entity\City
                repository: App\SearchRepository\CityElasticaRepository
                provider:
                    batch_size: 5000
        # When changing properties below, update User::shouldBeUpdated() accordingly
        user:
            settings:
                index: *index_settings
                analysis:
                    filter:
                        french_elision: *french_elision_filter
                    analyzer:
                        text_analyzer: *text_analyzer
            dynamic: false
            serializer:
                groups:
                    - 'elasticsearch:user:details'
                # An update is merged into the stored document: a field that became null must be sent as
                # null to clear it, or the document would keep the value it had (a removed category, a
                # place without a city, a cleared description would stay searchable until a full populate)
                serialize_null: true
            properties:
                # Public data only: a member is found by the name shown on their profile. Their first
                # and last names are private and must not make them searchable
                username:
                    type: text
                    analyzer: text_analyzer
            persistence:
                model: App\Entity\User
                repository: App\SearchRepository\UserElasticaRepository
                provider:
                    batch_size: 1000
        tag:
            settings:
                index: *index_settings
                analysis:
                    filter:
                        french_elision: *french_elision_filter
                        autocomplete_ngram: *autocomplete_ngram_filter
                    analyzer:
                        text_analyzer: *text_analyzer
                        autocomplete_index: *autocomplete_index_analyzer
            dynamic: false
            serializer:
                groups:
                    - 'elasticsearch:tag:details'
                # An update is merged into the stored document: a field that became null must be sent as
                # null to clear it, or the document would keep the value it had (a removed category, a
                # place without a city, a cleared description would stay searchable until a full populate)
                serialize_null: true
            properties:
                name:
                    type: text
                    analyzer: text_analyzer
                    fields:
                        autocomplete:
                            type: text
                            analyzer: autocomplete_index
                            search_analyzer: text_analyzer
            persistence:
                model: App\Entity\Tag
                repository: App\SearchRepository\TagElasticaRepository
                provider:
                    batch_size: 1000

when@test:
    fos_elastica:
        indexes:
            event:
                persistence:
                    listener:
                        insert: false
                        update: false
                        delete: false
            city:
                persistence:
                    listener:
                        insert: false
                        update: false
                        delete: false
            user:
                persistence:
                    listener:
                        insert: false
                        update: false
                        delete: false
            tag:
                persistence:
                    listener:
                        insert: false
                        update: false
                        delete: false
