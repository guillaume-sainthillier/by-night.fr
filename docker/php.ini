short_open_tag = Off
date.timezone = Europe/Paris
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
error_log = /proc/self/fd/2
session.auto_start = Off
memory_limit = 512M
max_execution_time = 30
expose_php = Off
; Errors go to the logs (error_log above), never into a response: a fatal error that bypasses
; Symfony's handler (memory_limit, max_execution_time) was otherwise sent to the visitor with a
; 200, path included, and logged nowhere (no php.ini is loaded, so log_errors defaulted to Off).
display_errors = Off
display_startup_errors = Off
log_errors = On

opcache.preload_user=root
opcache.preload=/app/config/preload.php

opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.fast_shutdown = 1
opcache.enable_file_override = 1

upload_max_filesize = 12M
post_max_size = 12M

realpath_cache_size=4096k
realpath_cache_ttl=7200
